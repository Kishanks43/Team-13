<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Merge Simulator</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/ui/app.css" />
    <link rel="stylesheet" href="src/ui/diff.css" />
  </head>
  <body>
    <header>
      <h1>Web-Based Code Merge Simulator</h1>
      <p>Put two versions of some code side by side and see exactly what differs.</p>
    </header>

    <main>
      <section class="toolbar" aria-label="Actions">
        <label for="sample-select">Sample</label>
        <select id="sample-select"></select>
        <button type="button" id="load-sample-btn">Load sample</button>
        <button type="button" id="compare-btn" class="primary">Compare</button>
      </section>

      <section class="panes" aria-label="Code versions">
        <div>
          <div class="pane-head">
            <label for="pane-a">Version A</label>
            <span id="count-a" class="pane-count">0 lines</span>
            <button type="button" id="load-a-btn" class="small">Load file…</button>
            <input type="file" id="file-a" hidden />
          </div>
          <textarea id="pane-a" spellcheck="false" autocomplete="off"></textarea>
          <p id="note-a" class="pane-note" role="status" aria-live="polite"></p>
        </div>
        <div>
          <div class="pane-head">
            <label for="pane-b">Version B</label>
            <span id="count-b" class="pane-count">0 lines</span>
            <button type="button" id="load-b-btn" class="small">Load file…</button>
            <input type="file" id="file-b" hidden />
          </div>
          <textarea id="pane-b" spellcheck="false" autocomplete="off"></textarea>
          <p id="note-b" class="pane-note" role="status" aria-live="polite"></p>
        </div>
      </section>

      <p id="diff-summary" role="status" aria-live="polite"></p>
      <p id="conflict-counter" role="status" aria-live="polite"></p>

      <section class="conflicts" aria-label="Conflicts">
        <h2>Conflicts</h2>
        <div class="conflict-nav-toolbar" role="toolbar" aria-label="Conflict navigation and history">
          <button type="button" id="prev-conflict-btn" aria-label="Previous conflict ([)" title="Previous conflict ([)">&#8592; Prev</button>
          <button type="button" id="next-conflict-btn" aria-label="Next conflict (])" title="Next conflict (])">Next &#8594;</button>
          <button type="button" id="undo-btn" disabled aria-keyshortcuts="Control+Z Meta+Z" title="Undo (Ctrl+Z / Cmd+Z)">Undo</button>
          <button type="button" id="redo-btn" disabled aria-keyshortcuts="Control+Y Control+Shift+Z Meta+Shift+Z" title="Redo (Ctrl+Y / Cmd+Shift+Z)">Redo</button>
        </div>
        <div id="conflict-list"></div>
      </section>
      <section id="diff-output" aria-label="Comparison result"></section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
