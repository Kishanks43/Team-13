<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Code Merge Simulator</title>
  <link rel="stylesheet" href="src/ui/app.css">
  <link rel="stylesheet" href="src/ui/diff.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Code Merge Simulator</h1>
    <p>Compare two versions of some code, resolve every conflict, and build one merged result.</p>
  </header>

  <noscript><p class="notice">This tool needs JavaScript to compare and merge code.</p></noscript>

  <main id="main">
    <section class="toolbar" aria-labelledby="start-heading">
      <h2 id="start-heading" class="sr-only">Start</h2>
      <div class="field-inline">
        <label for="sample-select">Sample scenario</label>
        <select id="sample-select"></select>
        <button type="button" id="load-sample-btn" class="secondary">Load sample</button>
      </div>
      <button type="button" id="compare-btn" class="primary">Compare</button>
    </section>

    <section class="panes" aria-labelledby="inputs-heading">
      <h2 id="inputs-heading" class="sr-only">Versions to compare</h2>
      <div class="pane">
        <label for="pane-a" class="pane-label">Version A</label>
        <textarea id="pane-a" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" rows="12"></textarea>
        <div class="pane-meta">
          <button type="button" id="load-a-btn" class="secondary">Load Version A from file</button>
          <input type="file" id="file-a" accept=".txt,.js,.json,.md,.css,.html,.py,.java,.c,.cpp,.ts,text/*" hidden tabindex="-1">
          <span id="count-a" class="count">0 lines</span>
        </div>
        <p id="note-a" class="note"></p>
      </div>

      <div class="pane">
        <label for="pane-b" class="pane-label">Version B</label>
        <textarea id="pane-b" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" rows="12"></textarea>
        <div class="pane-meta">
          <button type="button" id="load-b-btn" class="secondary">Load Version B from file</button>
          <input type="file" id="file-b" accept=".txt,.js,.json,.md,.css,.html,.py,.java,.c,.cpp,.ts,text/*" hidden tabindex="-1">
          <span id="count-b" class="count">0 lines</span>
        </div>
        <p id="note-b" class="note"></p>
      </div>
    </section>

    <section aria-labelledby="diff-heading">
      <h2 id="diff-heading">Differences</h2>
      <p id="diff-summary" class="summary">Press Compare to see the differences.</p>
      <div id="diff-output" class="diff-output"></div>
    </section>

    <section aria-labelledby="conflicts-heading">
      <h2 id="conflicts-heading">Conflicts</h2>
      <div class="conflict-bar">
        <p id="conflict-counter" class="summary">No conflicts</p>
        <div class="button-row">
          <button type="button" id="undo-btn" class="secondary" disabled>Undo</button>
          <button type="button" id="redo-btn" class="secondary" disabled>Redo</button>
        </div>
      </div>
      <div id="conflict-list" class="conflict-list"></div>
    </section>

    <section aria-labelledby="merged-heading">
      <h2 id="merged-heading">Merged result</h2>
      <label for="merged-result" class="pane-label">Merged text (you can edit it)</label>
      <textarea id="merged-result" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" rows="14"></textarea>
      <p id="merge-note" class="note">Press Compare to start.</p>
    </section>
  </main>
</body>
</html>
